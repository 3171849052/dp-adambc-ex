[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-adambc-ex"
version = "0.1.0"
description = "Reproducible BERT-base and RoBERTa-base QNLI experiments with Opacus GDP training."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "datasets>=2.14",
    "opacus>=1.4",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "scipy",
    "packaging",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["roberta_qnli*", "bert_qnli*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
