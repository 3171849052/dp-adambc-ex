algorithm: dpadam
seed: 0

model:
  name: bert-base-cased
  num_labels: 2

data:
  dataset_name: glue
  dataset_config: qnli
  train_split: train
  eval_split: validation
  max_length: 128
  logical_batch_size: 8
  max_physical_batch_size: 2
  eval_batch_size: 8
  max_train_samples: 32
  max_eval_samples: 32

training:
  epochs: 1
  max_steps: 2
  learning_rate: 1.0e-4
  optimizer: adam
  weight_decay: 0.0
  warmup_steps: 0
  scheduler: none

privacy:
  epsilon: 3.0
  delta: 1.0e-5
  accountant: gdp
  noise_type: iid_gaussian
  max_grad_norm: 1.0
  clipping: flat
  grad_sample_mode: ghost
  poisson_sampling: true
  loss_reduction: mean
  wrap_model: false

runtime:
  device: auto
  gpu: 0
  num_workers: 0
  pin_memory: true

output:
  root: outputs

logging:
  log_every_steps: 1
